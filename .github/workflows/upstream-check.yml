name: Upstream Check

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      open_validated_pr:
        description: 'Run build/test validation and open a draft PR when checks pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  determine-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Enumerate packages
        id: packages
        run: |
          set -euo pipefail
          packages=$(./scripts/package.py | awk '/^-/{print $2}' | grep -v '^_')
          PACKAGES="$packages" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          pkgs = [p for p in os.environ.get('PACKAGES', '').splitlines() if p]
          print(f"packages={json.dumps(pkgs)}")
          PY

  check:
    needs: determine-packages
    if: ${{ needs.determine-packages.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      updates: ${{ steps.upstream.outputs.updates }}
      updates_count: ${{ steps.upstream.outputs.updates_count }}
      results: ${{ steps.upstream.outputs.results }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Check upstream
        id: upstream
        env:
          PACKAGES_JSON: ${{ needs.determine-packages.outputs.packages }}
        run: python3 scripts/check_upstream_ci.py
      - name: Summarize results
        env:
          RESULTS_JSON: ${{ steps.upstream.outputs.results }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          print('#### Upstream check')
          results = json.loads(os.environ.get('RESULTS_JSON') or '[]')
          if not results:
              print('No packages evaluated.')
          else:
              for entry in results:
                  pkg = entry.get('package')
                  status = entry.get('status')
                  latest = entry.get('latest')
                  current = entry.get('current')
                  line = f"- **{pkg}**: {status}"
                  if latest:
                      line += f" (latest {latest}, current {current})"
                  print(line)
          PY
      - name: Render issue body
        env:
          RESULTS_JSON: ${{ steps.upstream.outputs.results }}
          UPDATES_JSON: ${{ steps.upstream.outputs.updates }}
        run: python3 scripts/render_upstream_report.py > upstream-report.md
      - name: Create or update upstream report issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          REPORT_BODY: ${{ steps.upstream.outputs.results }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Upstream version check report';
            const body = fs.readFileSync('upstream-report.md', 'utf8');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created issue #${created.data.number}`);
            }

  validated-pr:
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.open_validated_pr == true && needs.check.outputs.updates_count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Apply upstream updates
        env:
          UPDATES_JSON: ${{ needs.check.outputs.updates }}
        run: python3 scripts/apply_upstream_updates.py
      - name: Build and test updated packages
        env:
          UPDATES_JSON: ${{ needs.check.outputs.updates }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(UPDATES_JSON="$UPDATES_JSON" python3 - <<'PY'
          import json
          import os
          updates = json.loads(os.environ.get('UPDATES_JSON') or '[]')
          pkgs = sorted({entry.get('package') for entry in updates if entry.get('package')})
          for pkg in pkgs:
              print(pkg)
          PY
          )

          for pkg in "${packages[@]}"; do
            echo "==> build ${pkg}"
            make build PACKAGE="${pkg}"
            echo "==> test ${pkg}"
            make test PACKAGE="${pkg}"
            if [ -x "containers/${pkg}/tests/e2e.sh" ]; then
              image_ref=$(PACKAGE="${pkg}" python3 - <<'PY'
              import os
              from pathlib import Path
              import yaml
              pkg = os.environ["PACKAGE"]
              metadata_path = Path("containers") / pkg / "container.yaml"
              data = yaml.safe_load(metadata_path.read_text())
              image = data["publish"]["image"]
              version = data["version"]["current"]
              print(f"{image}:{version}")
              PY
              )
              echo "==> e2e ${pkg}"
              SKIP_PACKAGE_BUILD=1 SKIP_PACKAGE_TEST=1 E2E_IMAGE="${image_ref}" make e2e PACKAGE="${pkg}"
            fi
          done
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Render PR body
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          RESULTS_JSON: ${{ needs.check.outputs.results }}
          UPDATES_JSON: ${{ needs.check.outputs.updates }}
        run: python3 scripts/render_upstream_report.py > pr-body.md
      - name: Create validated upgrade PR
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: "chore: apply validated upstream version updates"
          title: "Validated upstream version updates"
          body-path: pr-body.md
          branch: upstream-updates-validated
          draft: true
          labels: upstream-update
